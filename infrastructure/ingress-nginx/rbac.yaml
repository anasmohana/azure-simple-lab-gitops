# The AKS Flux extension runs the Helm controller as ingress-nginx:flux-applier. On clusters with
# Azure RBAC for Kubernetes that identity has no permissions by default. Grant only what installing
# this one chart needs (rendered from chart 4.11.x):
#   - namespace admin in ingress-nginx
#   - create the chart's six cluster-scoped objects; change/delete only those exact names
#   - escalate/bind on the chart's two ClusterRoles only (so it never holds their rules itself)
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: flux-applier-admin
  namespace: ingress-nginx
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: admin
subjects:
  - kind: ServiceAccount
    name: flux-applier
    namespace: ingress-nginx
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: flux-applier-ingress-nginx
rules:
  - apiGroups: [rbac.authorization.k8s.io]
    resources: [clusterroles, clusterrolebindings]
    verbs: [create]
  - apiGroups: [rbac.authorization.k8s.io]
    resources: [clusterroles]
    resourceNames: [ingress-nginx, ingress-nginx-admission]
    verbs: [get, update, patch, delete, escalate, bind]
  - apiGroups: [rbac.authorization.k8s.io]
    resources: [clusterrolebindings]
    resourceNames: [ingress-nginx, ingress-nginx-admission]
    verbs: [get, update, patch, delete]
  - apiGroups: [networking.k8s.io]
    resources: [ingressclasses]
    verbs: [create]
  - apiGroups: [networking.k8s.io]
    resources: [ingressclasses]
    resourceNames: [nginx]
    verbs: [get, update, patch, delete]
  - apiGroups: [admissionregistration.k8s.io]
    resources: [validatingwebhookconfigurations]
    verbs: [create]
  - apiGroups: [admissionregistration.k8s.io]
    resources: [validatingwebhookconfigurations]
    resourceNames: [ingress-nginx-admission]
    verbs: [get, update, patch, delete]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: flux-applier-ingress-nginx
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: flux-applier-ingress-nginx
subjects:
  - kind: ServiceAccount
    name: flux-applier
    namespace: ingress-nginx
