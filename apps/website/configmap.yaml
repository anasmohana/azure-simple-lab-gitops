apiVersion: v1
kind: ConfigMap
metadata:
  name: site
  namespace: website
data:
  index.html: |
    <!doctype html>
    <html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Anas Meeting Today</title>
    <style>body{font-family:system-ui,sans-serif;max-width:40rem;margin:4rem auto;padding:0 1rem;line-height:1.5}
    code{background:#eee;padding:.1rem .3rem;border-radius:4px}</style></head>
    <body>
    <h1>azure-simple-lab</h1>
    <p><strong>v2</strong> - this version was shipped by a pull request merged in the gitops repo; Flux rolled it out with no manual kubectl.</p>
    <p>Served from AKS through ingress-nginx, delivered by Flux (GitOps), provisioned by Terraform from GitHub Actions with OIDC.</p>
    <p>Change this page by editing <code>apps/website/configmap.yaml</code> in the gitops repo.</p>
    <h2>Pod identity</h2>
    <p id="kv">Reading Key Vault status...</p>
    <script>
    fetch('/kv/status.json').then(r=>r.json()).then(j=>{
      document.getElementById('kv').innerHTML='Read from Key Vault with the pod\'s federated identity (no stored credentials):<br>secret <code>'+j.id.split('/secrets/')[1]+'</code> = <code>'+j.value+'</code> (deliberately non-sensitive demo value).';
    }).catch(()=>{document.getElementById('kv').textContent='Key Vault read not available.'});
    </script>
    </body></html>
